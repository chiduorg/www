# chidu.org · 五轴二级域名静态部署（http 上下文片段）
# 门户 chidu.org + 五轴 space/time/temperature/elements/mass + 共享资源 static.chidu.org。
# 用法：把本文件放到 /etc/nginx/conf.d/chidu.conf（或 sites-enabled 链接），由主配置的
# http {} 上下文加载；不要用它整体替换 /etc/nginx/nginx.conf（那会缺少 events/http 与
# mime.types）。放置后先执行 nginx -t，再 reload。
# 站点根目录是 /srv/chidu/current 软链；整合产物布局：
#   current/index.html                 → 门户
#   current/{space,time,temperature,elements,mass}/ → 各子域根
#   current/static/                    → vendor / og / media / favicon.svg
#
# TLS：必须使用同时覆盖 chidu.org 与 *.chidu.org 的证书（通配符证书不覆盖 apex），
# 例如 SAN = chidu.org, *.chidu.org；路径按实际环境替换。
# 默认只启用 gzip。brotli 依赖第三方模块 ngx_brotli，标准 nginx 未编译时 nginx -t 会直接失败；
# 如目标机已装 ngx_brotli，取消 brotli 段注释。
#
# 缓存策略：产物文件名不含内容指纹，CSS/JS 只做 5 分钟短缓存并强制协商；
# 只有图片、字体与 OG 图这类内容稳定的二进制资源才使用长缓存。
# 注意：nginx 的 add_header 在同一层级内是“覆盖”而非“合并”。凡是在 location 中
# 写了 add_header 的位置，都必须重复完整的公共安全头，否则 server 层的头不会继承。

map $host $atlas_root {
    default                     "";
    chidu.org                   "";
    space.chidu.org             "space";
    time.chidu.org              "time";
    temperature.chidu.org       "temperature";
    elements.chidu.org          "elements";
    mass.chidu.org              "mass";
}

# 每主机可独立指向某一版发布目录：默认跟随 current 软链；
# 需要“逐域回滚”时，只把对应主机改到 /srv/chidu/releases/<上一版>，
# nginx -t && systemctl reload nginx，其余主机不受影响。
map $host $atlas_release {
    default                     /srv/chidu/current;
    chidu.org                   /srv/chidu/current;
    space.chidu.org             /srv/chidu/current;
    time.chidu.org              /srv/chidu/current;
    temperature.chidu.org       /srv/chidu/current;
    elements.chidu.org          /srv/chidu/current;
    mass.chidu.org              /srv/chidu/current;
    static.chidu.org            /srv/chidu/current;
}

server {
    # nginx 1.25.1+ 推荐改为 `listen 443 ssl;` + `http2 on;`；1.25.1 以下保持当前写法。
    listen 443 ssl http2;
    server_name chidu.org www.chidu.org space.chidu.org time.chidu.org temperature.chidu.org elements.chidu.org mass.chidu.org;
    root $atlas_release/$atlas_root;
    index index.html;
    server_tokens off;
    charset utf-8;

    # 统一主机名：www 永久跳到 apex，避免重复内容与重复 canonical。
    if ($host = www.chidu.org) { return 301 https://chidu.org$request_uri; }

    ssl_certificate     /etc/letsencrypt/live/chidu.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chidu.org-0001/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 公共安全头（server 层，供未单独设置 add_header 的 location 继承）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml application/manifest+json;

    # brotli 需要第三方模块 ngx_brotli；已安装时可取消以下注释。
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 1024;
    # brotli_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml application/manifest+json;

    # HTML 不缓存，便于内容版本更新。
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache" always;
    }

    # 其余 HTML 页面同样不缓存；目录路径经 try_files 内部跳转到 *.html。
    location ~* \.html$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache" always;
    }

    # 旧路径明确放弃：门户上的 /space/、/time/、/energy/ 等直接 404，不做 301。
    # 五轴子域自身仍可正常使用，不受影响。
    location ~ ^/(space|time|energy|temperature|elements|mass)(/|$) {
        if ($host = chidu.org) { return 404; }
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache" always;
    }

    # 条目原文 Markdown 以纯文本提供，避免被当成二进制下载。
    location ~* \.md$ {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    # 内容与索引 JSON 的 URL 不带版本号，必须每次协商缓存。
    location ~* \.json$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache" always;
    }

    # 脚本与样式无内容指纹：短缓存 + 必须回源校验，避免更新后长时间不可达。
    location ~* \.(css|js|mjs)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # 图片、字体与 OG 图内容稳定，使用长缓存。
    location ~* \.(png|jpg|jpeg|webp|svg|woff2?)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /sitemap.xml {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /sitemap-pages.xml {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /robots.txt {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    error_page 404 /404.html;
}

# 共享资产：仅一份 three.js、OG 图、媒体图片与图标，供五个子域跨域引用。
server {
    listen 443 ssl http2;
    server_name static.chidu.org;
    root $atlas_release/static;
    index index.html;
    server_tokens off;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/chidu.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chidu.org-0001/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

# HTTP → HTTPS：门户、五轴与静态资源主机统一跳转。
server {
    listen 80;
    server_name chidu.org www.chidu.org space.chidu.org time.chidu.org temperature.chidu.org elements.chidu.org mass.chidu.org static.chidu.org;
    if ($host = www.chidu.org) { return 301 https://chidu.org$request_uri; }
    return 301 https://$host$request_uri;
}
